<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>家长 · 本地消息档案</title>
<style>
  :root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#141d21;color:#e9efed}
  body{max-width:1100px;margin:auto;padding:24px}h1{font-size:25px}p{line-height:1.7;color:#bdceca}
  form{display:flex;flex-wrap:wrap;gap:12px;padding:18px;background:#223036;border-radius:14px}
  label{display:grid;gap:6px;font-size:14px}input,select,button{font:inherit;border:1px solid #526d70;border-radius:7px;padding:9px;background:#19262b;color:inherit}
  button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.primary{background:#346c65}
  #status{min-height:24px}#status.error{color:#ffb3a6}.actions{display:flex;gap:12px;align-items:end}
  article{border-bottom:1px solid #3d5358;padding:16px 0}article header{display:flex;gap:10px;flex-wrap:wrap;color:#bad5ce;font-size:13px}
  article p{white-space:pre-wrap;overflow-wrap:anywhere;color:inherit;margin:8px 0}#more{margin:20px 0}.sent{color:#efca98}
  @media(max-width:540px){body{padding:14px}form{padding:12px}label{flex:1;min-width:120px}.actions{flex-basis:100%}}
</style></head>
<body><h1>家长 · 本地消息档案</h1>
<p>消息保存在孩子运行 Coo 的电脑上，不随客厅服务器的 7 天回放清理。网页关闭后扩展仍会记录；已经丢失的旧消息无法补回。</p>
<p>这里的“收到”表示孩子有权接收的客厅通信，不代表模型逐条读过。局中或未连接时，私密牌桌通知暂不展示；连接后确认已结束可回看。</p>
<form id="filters">
  <label>开始（北京时间）<input id="from" type="datetime-local" required></label>
  <label>结束（不含此时刻）<input id="until" type="datetime-local" required></label>
  <label>客厅<select id="room"><option value="">全部客厅</option></select></label>
  <label>收发<select id="direction"><option value="">全部</option><option value="received">孩子收到</option><option value="sent">孩子发出</option></select></label>
  <label>进出提示<select id="presence"><option value="">显示全部</option><option value="hide">隐藏 Coo／家长进出</option></select></label>
  <div class="actions"><button class="primary" type="submit">查询</button><button id="export" type="button">导出当前范围</button></div>
</form>
<p id="info"></p><p id="status" role="status" aria-live="polite"></p>
<section id="messages" aria-label="消息记录"></section>
<button id="more" type="button" hidden>更早的消息</button>
<script src="./script"></script></body></html>
